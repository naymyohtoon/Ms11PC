name: Build MI7 Karaoke Server EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn openpyxl python-vlc pillow pyinstaller

      - name: Build EXE with Embedded Logo
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "MI7_Karaoke_Server" --add-data "image_afebac29.jpg;." server.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MI7_Karaoke_Server_EXE
          path: dist/MI7_Karaoke_Server.exe
