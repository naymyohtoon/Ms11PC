import 'dart:async';
import 'dart:convert';
import 'package:flutter/material.dart';
import 'package:flutter/services.dart';
import 'package:http/http.dart' as http;
import 'package:shared_preferences/shared_preferences.dart';

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  SystemChrome.setPreferredOrientations([
    DeviceOrientation.landscapeLeft,
    DeviceOrientation.landscapeRight,
  ]);
  runApp(const NMHKaraokeApp());
}

class NMHKaraokeApp extends StatelessWidget {
  const NMHKaraokeApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'NMH Karaoke Remote',
      debugShowCheckedModeBanner: false,
      theme: ThemeData.dark().copyWith(
        scaffoldBackgroundColor: const Color(0xFF2B2E33),
      ),
      home: const NMHHomeScreen(),
    );
  }
}

class NMHHomeScreen extends StatefulWidget {
  const NMHHomeScreen({super.key});

  @override
  State<NMHHomeScreen> createState() => _NMHHomeScreenState();
}

class _NMHHomeScreenState extends State<NMHHomeScreen> {
  String _serverIp = "10.167.210.192";
  bool _isConnected = false;
  bool _isPlaying = false;
  bool _vocalOff = false;
  bool _repeat = false;
  double _volume = 80;
  List<dynamic> _queueList = [];
  Map<String, dynamic>? _currentSong;

  String _screenMode = "HOME";
  String _listTitle = "";
  String _currentBaseEndpoint = "";
  List<dynamic> _items = [];
  bool _isLoading = false;
  bool _isLoadingMore = false;
  bool _hasMore = true;
  int _offset = 0;

  String _numberInput = "";
  final TextEditingController _searchCtrl = TextEditingController();
  final ScrollController _scrollCtrl = ScrollController();

  Timer? _timer;

  @override
  void initState() {
    super.initState();
    _loadIp();
    _scrollCtrl.addListener(_onScroll);
    _timer = Timer.periodic(const Duration(seconds: 1), (_) => _fetchStatus());
  }

  @override
  void dispose() {
    _timer?.cancel();
    _scrollCtrl.dispose();
    _searchCtrl.dispose();
    super.dispose();
  }

  void _onScroll() {
    if (_scrollCtrl.position.pixels >= _scrollCtrl.position.maxScrollExtent - 200) {
      if (!_isLoading && !_isLoadingMore && _hasMore && _currentBaseEndpoint.isNotEmpty) {
        _loadMoreData();
      }
    }
  }

  Future<void> _loadIp() async {
    final prefs = await SharedPreferences.getInstance();
    setState(() {
      _serverIp = prefs.getString('server_ip') ?? "10.167.210.192";
    });
  }

  Future<void> _saveIp(String ip) async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setString('server_ip', ip);
    setState(() => _serverIp = ip);
  }

  String get baseUrl => "http://$_serverIp:8000";

  Future<void> _fetchStatus() async {
    try {
      final res = await http.get(Uri.parse("$baseUrl/status")).timeout(const Duration(seconds: 2));
      if (res.statusCode == 200) {
        final data = json.decode(utf8.decode(res.bodyBytes));
        final qRes = await http.get(Uri.parse("$baseUrl/queue")).timeout(const Duration(seconds: 2));
        List<dynamic> qData = _queueList;
        if (qRes.statusCode == 200) {
          qData = json.decode(utf8.decode(qRes.bodyBytes));
        }
        setState(() {
          _isConnected = true;
          _isPlaying = data['is_playing'] ?? false;
          _currentSong = data['current_song'];
          _vocalOff = data['vocal_off'] ?? false;
          _repeat = data['repeat'] ?? false;
          _queueList = qData;
          if (data['volume'] != null && data['volume'] >= 0) {
            _volume = (data['volume'] as num).toDouble().clamp(0, 100);
          }
        });
      }
    } catch (_) {
      if (_isConnected) setState(() => _isConnected = false);
    }
  }

  Future<void> _control(String action, {int value = 0}) async {
    try {
      await http.post(Uri.parse("$baseUrl/control/$action?value=$value"));
      _fetchStatus();
    } catch (_) {}
  }

  Future<void> _loadData(String mode, String title, String baseEndpoint) async {
    setState(() {
      _screenMode = mode;
      _listTitle = title;
      _currentBaseEndpoint = baseEndpoint;
      _isLoading = true;
      _hasMore = true;
      _offset = 0;
      _items = [];
    });
    try {
      final sep = baseEndpoint.contains('?') ? '&' : '?';
      final url = "$baseUrl$baseEndpoint${sep}offset=0&limit=100";
      final res = await http.get(Uri.parse(url));
      if (res.statusCode == 200) {
        final List<dynamic> fetched = json.decode(utf8.decode(res.bodyBytes));
        setState(() {
          _items = fetched;
          _offset = fetched.length;
          _hasMore = fetched.length == 100;
          _isLoading = false;
        });
      }
    } catch (_) {
      setState(() => _isLoading = false);
    }
  }

  Future<void> _loadMoreData() async {
    setState(() => _isLoadingMore = true);
    try {
      final sep = _currentBaseEndpoint.contains('?') ? '&' : '?';
      final url = "$baseUrl$_currentBaseEndpoint${sep}offset=$_offset&limit=100";
      final res = await http.get(Uri.parse(url));
      if (res.statusCode == 200) {
        final List<dynamic> fetched = json.decode(utf8.decode(res.bodyBytes));
        setState(() {
          _items.addAll(fetched);
          _offset += fetched.length;
          _hasMore = fetched.length == 100;
          _isLoadingMore = false;
        });
      }
    } catch (_) {
      setState(() => _isLoadingMore = false);
    }
  }
    Future<void> _addSong(String id) async {
    try {
      final res = await http.post(Uri.parse("$baseUrl/queue/add/$id"));
      if (res.statusCode == 200) {
        _fetchStatus();
        if (mounted) {
          ScaffoldMessenger.of(context).showSnackBar(
            SnackBar(content: Text("Code ($id) ရွေးထားသော စာရင်းထဲ ထည့်ပြီးပါပြီ"), duration: const Duration(seconds: 1)),
          );
        }
      } else {
        if (mounted) {
          ScaffoldMessenger.of(context).showSnackBar(
            SnackBar(content: Text("ဗီဒီယိုဖိုင် ရှာမတွေ့ပါ ($id)"), backgroundColor: Colors.red),
          );
        }
      }
    } catch (_) {}
  }

  void _showIpDialog() {
    final ctrl = TextEditingController(text: _serverIp);
    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF1F2429),
        title: const Text("PC Server IP ထည့်ရန်", style: TextStyle(color: Colors.tealAccent)),
        content: TextField(
          controller: ctrl,
          keyboardType: TextInputType.number,
          decoration: const InputDecoration(labelText: "PC IP Address", border: OutlineInputBorder()),
        ),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("ပိတ်မည်")),
          ElevatedButton(
            style: ElevatedButton.styleFrom(backgroundColor: Colors.tealAccent, foregroundColor: Colors.black),
            onPressed: () {
              _saveIp(ctrl.text.trim());
              Navigator.pop(ctx);
            },
            child: const Text("ချိတ်ဆက်မည်"),
          ),
        ],
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: SafeArea(
        child: Container(
          decoration: const BoxDecoration(
            gradient: LinearGradient(
              colors: [Color(0xFF3A3F45), Color(0xFF23272B)],
              begin: Alignment.topCenter,
              end: Alignment.bottomCenter,
            ),
          ),
          child: Column(
            children: [
              _buildTopBar(),
              Expanded(child: _buildMainContent()),
              _buildBottomControlBar(),
            ],
          ),
        ),
      ),
    );
  }

