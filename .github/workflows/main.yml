name: Build and Release NMH Server EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn openpyxl python-vlc pillow pyinstaller

      - name: Build NMH EXE with Embedded Logo
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NMH_Karaoke_Server" --add-data "image_afebac29.jpg;." server.py

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-nmh-server
          name: NMH Karaoke Server (Windows EXE)
          files: dist/NMH_Karaoke_Server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

